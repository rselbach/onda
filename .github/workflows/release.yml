name: Release

# Builds, signs, notarizes, and publishes a release for a v* tag
# (REL-3, REL-4, REL-6, UPD-3, UPD-5).
#
# GitHub Releases hold the versioned ZIP (what the in-app updater installs)
# and DMG, both packaged from the same stapled Onda.app, plus native Linux
# DEB, RPM, Arch, and tar.gz packages for both architectures. GitHub Pages holds
# two feeds, deployed together only after the release's assets download and
# verify: update.json, the signed feed current Onda reads, and appcast.xml,
# the Sparkle appcast that builds from before the switch still read.
#
# Repository secrets (names match the github-deployment-secrets helper):
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate and
#                                 private key, base64-encoded P12
#   MACOS_CERTIFICATE_PASSWORD    password of that P12
#   APPLE_ID                      Apple Account that notarizes
#   APPLE_TEAM_ID                 Developer team ID
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password of that account
#   SPARKLE_EDDSA_PRIVATE_KEY     base64 Ed25519 seed (generate_keys -x)
#                                 whose public key is SUPublicEDKey in
#                                 shell/macos/Info.plist and
#                                 onda_update::PUBLIC_KEY; signs update.json
#                                 and the legacy appcast's DMG
#   DEEPSEEK_API_TOKEN            release notes (rselbach/actions/pi-release-notes)
#
# GitHub Pages must use "GitHub Actions" as its source.

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # the feeds have no channels, so a release reaches every user. only a
  # final version tagged on main may become one
  check-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a final version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a final version (vX.Y.Z)" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${TAG} is not on main" >&2
            exit 1
          fi

  linux:
    needs: check-tag
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ github.ref_name }}

  # the notes action installs npm packages whose dependencies float, so it
  # runs apart from the artifacts and the feed key; only its Markdown
  # crosses over
  release-notes:
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
        run: |
          if [[ -z "${DEEPSEEK_API_TOKEN}" ]]; then
            echo "::error::secret DEEPSEEK_API_TOKEN is not set" >&2
            exit 1
          fi

      - name: Generate release notes
        uses: rselbach/actions/pi-release-notes@93af3769b4088fb0bca1dc942e558b774876432f # v1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_TOKEN }}
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
        with:
          project-name: Onda
          project-description: macOS and Linux app for local, on-device speech-to-text dictation.
          output-file: build/release-notes.md
          additional-context: >-
            Keep notes user-facing and concise. Do not include installation
            instructions; macOS DMG and ZIP and Linux DEB, RPM, Arch, and tar.gz
            packages are attached. The signed update feed is updated separately.

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: build/release-notes.md
          if-no-files-found: error

  macos:
    needs: check-tag
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Show toolchains
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          xcodebuild -version
          rustc --version

      - name: Validate required secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::secret ${name} is not set" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Set version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          base64 --decode <<<"${CERTIFICATE_P12}" >"${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 \
            -k "${keychain_path}"
          rm "${RUNNER_TEMP}/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db

      # bundle-app.sh signs with the imported Developer ID identity
      - name: Build, sign, notarize, and staple the ZIP and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/release.sh

      # the feed signer shares the app's verifier (crates/onda-update), and
      # signs Sparkle's format too, so no Sparkle tooling is needed
      - name: Build the update tool
        run: |
          cargo build --locked --release -p onda-update --bin onda-update-tool
          cp target/release/onda-update-tool build/onda-update-tool

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onda-macos-arm64
          path: |
            build/Onda-${{ steps.version.outputs.version }}-macos-arm64.zip
            build/Onda-${{ steps.version.outputs.version }}.dmg
            build/onda-update-tool
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always()
        run: |
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          if [[ -f "${keychain_path}" ]] && ! security delete-keychain "${keychain_path}"; then
            echo "::warning::failed to delete ${keychain_path}"
          fi

  publish:
    needs: [linux, macos, release-notes]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_EDDSA_PRIVATE_KEY}" ]]; then
            echo "::error::secret SPARKLE_EDDSA_PRIVATE_KEY is not set" >&2
            exit 1
          fi

      - name: Set version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: onda-macos-arm64
          path: build

      - name: Prepare the update tool
        run: chmod +x build/onda-update-tool

      # by exact name: any job in this run can upload an artifact, and a
      # pattern would sign whatever matched
      - name: Download x86_64 Linux packages
        uses: actions/download-artifact@v4
        with:
          name: onda-linux-x86_64
          path: build/linux

      - name: Download arm64 Linux packages
        uses: actions/download-artifact@v4
        with:
          name: onda-linux-arm64
          path: build/linux

      # outside build/: the artifact is untrusted and must not be able to
      # overwrite a file the next steps sign
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Sign the legacy Sparkle appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          SIGNING_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          dmg="build/Onda-${VERSION}.dmg"
          tool="build/onda-update-tool"
          signature="$("${tool}" sparkle-signature "${dmg}" <<<"${SIGNING_KEY}")"
          if [[ ! "${signature}" =~ ^sparkle:edSignature=\".+\"\ length=\"[0-9]+\"$ ]]; then
            echo "::error::unexpected sparkle-signature output"
            exit 1
          fi

          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            shell/macos/Info.plist)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Onda-${VERSION}.dmg"
          pub_date="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          mkdir -p _site
          cat >_site/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Onda Updates</title>
              <link>https://rselbach.github.io/onda/appcast.xml</link>
              <description>Onda app updates</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${pub_date}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${minimum_os}</sparkle:minimumSystemVersion>
                <enclosure url="${url}" ${signature} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout _site/appcast.xml

      - name: Sign the update feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          SIGNING_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          zip="Onda-${VERSION}-macos-arm64.zip"
          dmg="Onda-${VERSION}.dmg"
          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            shell/macos/Info.plist)"
          mkdir -p _site
          build/onda-update-tool sign-feed \
            --version "${VERSION}" --build "${BUILD}" \
            --minimum-os "${minimum_os}" \
            --published-at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --zip "build/${zip}" --zip-url "${base}/${zip}" \
            --dmg "build/${dmg}" --dmg-url "${base}/${dmg}" \
            --linux-dir build/linux --linux-base-url "${base}" \
            --out _site/update.json <<<"${SIGNING_KEY}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # a rerun must not change bytes an installed client already trusts
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            build/Onda-${{ steps.version.outputs.version }}-macos-arm64.zip
            build/Onda-${{ steps.version.outputs.version }}.dmg
            build/linux/*.deb
            build/linux/*.rpm
            build/linux/*.pkg.tar.zst
            build/linux/*.tar.gz
            build/linux/*.sha256
          body_path: ${{ runner.temp }}/release-notes/release-notes.md

      - name: Verify the published Linux checksum files
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import time
          import urllib.request
          from pathlib import Path

          base = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/{os.environ['GITHUB_REF_NAME']}"
          )
          for path in sorted(Path("build/linux").glob("*.sha256")):
              expected = hashlib.sha256(path.read_bytes()).digest()
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(f"{base}/{path.name}", timeout=120) as response:
                          actual = hashlib.sha256()
                          while chunk := response.read(1024 * 1024):
                              actual.update(chunk)
                      if actual.digest() != expected:
                          raise ValueError(f"Published asset differs: {path.name}")
                      break
                  except (OSError, ValueError):
                      if attempt == 4:
                          raise
                      time.sleep(5)
          PY

      # the feeds go live only once the published assets are the signed ones,
      # fetched through the app's own transport and URL policy
      - name: Verify the published assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          for attempt in 1 2 3 4 5; do
            if build/onda-update-tool verify-feed _site/update.json \
              --version "${VERSION}" --build "${BUILD}" --download; then
              exit 0
            fi
            echo "verification attempt ${attempt} failed; retrying" >&2
            sleep 15
          done
          echo "::error::the published assets do not match the signed feed"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # the action's default is one day; republish-feeds.yml redeploys
          # this artifact, and it is the only copy of the signed feeds
          retention-days: 90

  # one Pages deployment publishes update.json and appcast.xml together,
  # after the release's assets verified
  deploy-feeds:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: published
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public feeds
        run: python3 scripts/verify-published-feeds.py published/artifact.tar
