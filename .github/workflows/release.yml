name: Release

# Builds, signs, notarizes, and publishes a release for a v* tag
# (REL-3, REL-4, REL-6, UPD-3).
#
# Repository secrets (names match the github-deployment-secrets helper):
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate and
#                                 private key, base64-encoded P12
#   MACOS_CERTIFICATE_PASSWORD    password of that P12
#   APPLE_ID                      Apple Account that notarizes
#   APPLE_TEAM_ID                 Developer team ID
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password of that account
#   SPARKLE_EDDSA_PRIVATE_KEY     EdDSA key matching SUPublicEDKey in
#                                 shell/macos/Info.plist; signs the update
#   DEEPSEEK_API_TOKEN            release notes (rselbach/actions/pi-release-notes)
#
# GitHub Pages must use "GitHub Actions" as its source.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Show toolchains
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          xcodebuild -version
          rustc --version

      - name: Validate required secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD \
            SPARKLE_EDDSA_PRIVATE_KEY DEEPSEEK_API_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::secret ${name} is not set"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Set version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: release_notes
        uses: rselbach/actions/pi-release-notes@v1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_TOKEN }}
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
        with:
          project-name: Onda
          project-description: macOS menu bar app for local, on-device speech-to-text dictation.
          output-file: build/release-notes.md
          additional-context: >-
            Keep notes user-facing and concise. Do not include installation
            instructions; the signed DMG is attached to the GitHub release and
            the Sparkle appcast is updated separately.

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          base64 --decode <<<"${CERTIFICATE_P12}" >"${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 \
            -k "${keychain_path}"
          rm "${RUNNER_TEMP}/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db

      # bundle-app.sh signs with the imported Developer ID identity
      - name: Build, sign, notarize, and staple DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/release.sh

      # sign_update comes from the Sparkle artifact SwiftPM resolved (and
      # checksum-verified) for the build, so it matches the embedded framework
      - name: Sign update and generate appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          dmg="build/Onda-${VERSION}.dmg"
          sign_update="shell/macos/.build/artifacts/sparkle/Sparkle/bin/sign_update"
          signature="$("${sign_update}" --ed-key-file - "${dmg}" <<<"${SPARKLE_PRIVATE_KEY}")"
          if [[ ! "${signature}" =~ ^sparkle:edSignature=\".+\"\ length=\"[0-9]+\"$ ]]; then
            echo "::error::unexpected sign_update output"
            exit 1
          fi

          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            shell/macos/Info.plist)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Onda-${VERSION}.dmg"
          pub_date="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          mkdir -p _site
          cat >_site/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Onda Updates</title>
              <link>https://rselbach.github.io/onda/appcast.xml</link>
              <description>Onda app updates</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${pub_date}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${minimum_os}</sparkle:minimumSystemVersion>
                <enclosure url="${url}" ${signature} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout _site/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Onda-${{ steps.version.outputs.version }}.dmg
          body_path: ${{ steps.release_notes.outputs.body-path }}

      - name: Delete temporary keychain
        if: always()
        run: |
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          if [[ -f "${keychain_path}" ]] && ! security delete-keychain "${keychain_path}"; then
            echo "::warning::failed to delete ${keychain_path}"
          fi

  # the appcast goes live only after the release (and its DMG) exists
  deploy-appcast:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
