name: CI

# REL-5. No secrets: the release build is signed ad hoc.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-packages:
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: 0.0.0-ci

  linux:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      # The real-GUI tests start gnome-keyring-daemon. As root it keeps only
      # CAP_IPC_LOCK and aborts without it, and Docker withholds it by default.
      options: --cap-add IPC_LOCK
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          dnf install -y rust cargo rustfmt clippy gcc-c++ cmake clang-devel \
            pkgconf-pkg-config gtk4-devel libadwaita-devel gtk4-layer-shell-devel \
            alsa-lib-devel openssl-devel libX11-devel libXtst-devel \
            libxkbcommon-devel wayland-devel ShellCheck

      - name: Rust format
        run: cargo fmt --all --check

      - name: Linux lint
        run: cargo clippy --locked -p onda-linux --all-targets -- -D warnings

      - name: Linux and shared core tests
        run: |
          cargo test --locked -p onda-domain -p onda-app -p onda-adapters -p onda-audio \
            -p onda-linux -- --test-threads=1
          # Bundle swap and codesign tests run in the macOS job.
          cargo test --locked -p onda-update -- --skip install::tests

      - name: Linux real-GUI tests
        run: |
          dnf install -y xorg-x11-server-Xvfb dbus-daemon dbus-tools \
            gnome-keyring libsecret xclip python3
          scripts/test-linux-gui.sh

      - name: Linux build
        run: scripts/build-linux.sh

      - name: Shell lint
        run: |
          shellcheck scripts/build-linux.sh scripts/install-linux.sh \
            scripts/test-linux-dictation.sh scripts/test-linux-gui.sh \
            scripts/test-linux-overlay.sh

  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable

      - name: Show toolchains
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Swift format
        run: swiftformat --lint .

      - name: Swift build (debug)
        run: |
          scripts/build-ffi.sh debug
          swift build --package-path shell/macos --arch arm64

      - name: Swift tests
        run: swift test --package-path shell/macos --arch arm64

      - name: Release build
        env:
          SIGNING_IDENTITY: '-'
        run: scripts/bundle-app.sh release
