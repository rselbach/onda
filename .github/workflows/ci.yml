name: CI

# prd/10 REL-5. No secrets: the release build is signed ad hoc.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable

      - name: Show toolchains
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Swift format
        run: swiftformat --lint .

      - name: Swift build (debug)
        run: |
          scripts/build-ffi.sh debug
          swift build --package-path shell/macos --arch arm64

      - name: Swift tests
        run: swift test --package-path shell/macos --arch arm64

      - name: Release build
        env:
          SIGNING_IDENTITY: '-'
        run: scripts/bundle-app.sh release
