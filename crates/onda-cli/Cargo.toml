[package]
name = "onda-cli"
description = "Developer CLI for proving core behavior without the GUI (10 \"Milestones\")."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "onda-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hound = "3.5.1"
onda-adapters = { path = "../onda-adapters" }
onda-app = { path = "../onda-app" }
onda-asr = { path = "../onda-asr" }
onda-asr-coreml = { path = "../onda-asr-coreml" }
onda-audio = { path = "../onda-audio" }
onda-cleanup = { path = "../onda-cleanup" }
onda-domain = { path = "../onda-domain" }
onda-history = { path = "../onda-history" }
onda-models = { path = "../onda-models" }
onda-settings = { path = "../onda-settings" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
