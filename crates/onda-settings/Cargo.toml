[package]
name = "onda-settings"
description = "Typed Onda settings in settings.json, plus the OpenRouter key in the OS credential store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring = "4.2.0"
onda-domain = { path = "../onda-domain" }
serde_json = "1.0.154"
tracing = "0.1.44"

# the keychain store boxes security-framework errors; downcasting recovers the
# OSStatus for the CLN-24 copy
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
