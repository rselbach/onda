[package]
name = "onda-models"
description = "Speech model manager: download, validate, and delete model folders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
onda-asr = { path = "../onda-asr" }
onda-domain = { path = "../onda-domain" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net"] }

[lints]
workspace = true
