[package]
name = "onda-asr-coreml"
description = "Parakeet on CoreML (Apple Silicon) behind the onda-asr interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-core-ml = "0.3.2"
objc2-foundation = "0.3.2"
onda-asr = { path = "../onda-asr" }
onda-domain = { path = "../onda-domain" }
serde_json = "1.0.154"
tracing = "0.1"

[dev-dependencies]
hound = "3.5.1"

# the CoreML bindings need unsafe FFI, so this crate cannot inherit the
# workspace's unsafe_code = "deny"; it is confined to src/coreml.rs
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
