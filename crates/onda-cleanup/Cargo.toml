[package]
name = "onda-cleanup"
description = "OpenRouter HTTP client for transcript cleanup (05, \"Cleanup\")."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
onda-domain = { path = "../onda-domain" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "sync", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[lints]
workspace = true
