[workspace]
resolver = "3"
members = ["crates/*", "shell/linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# model verification hashes ~600 MB before each first load; an unoptimized
# sha2 makes that take seconds in dev builds of the app
[profile.dev.package.sha2]
opt-level = 3
